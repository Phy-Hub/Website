<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page Not Found - Schrödinger's Setup</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #12141a;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
        }

        /* Top fifth of the screen for the 404 text */
        .error-text {
            height: 20vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ecf0f1;
        }

        .error-text h1 {
            font-size: 3rem;
            color: #f1c40f;
            margin: 0 0 5px 0;
            letter-spacing: 2px;
        }

        .error-text p {
            font-size: 1.5rem;
            color: #bdc3c7;
            margin: 0;
        }

        /* Bottom section for the box, with margins on the side */
        .svg-container {
            width: 90%; /* Ensures distance from the side of the page */
            max-width: 800px;
            height: 75vh; /* Fits comfortably below the text */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            display: block;
            width: 100%;
            height: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>

    <div class="error-text">
        <h1>404</h1>
        <p>Page Not Found</p>
    </div>

    <div class="svg-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
            <defs>
                <!-- Expanded Radioactive Green Glow -->
                <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
                    <feGaussianBlur stdDeviation="15" result="blur1" />
                    <feGaussianBlur stdDeviation="35" result="blur2" />
                    <feMerge>
                        <feMergeNode in="blur2" />
                        <feMergeNode in="blur1" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <!-- Drop Shadow for Floor Objects -->
                <filter id="drop-shadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feDropShadow dx="8" dy="12" stdDeviation="8" flood-color="#000" flood-opacity="0.8"/>
                </filter>

                <!-- Realistic Cardboard Texture (Strict Masking to prevent grey corner smoke) -->
                <filter id="paper-texture" x="-10%" y="-10%" width="120%" height="120%">
                    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise"/>
                    <feComponentTransfer in="noise" result="lightNoise">
                        <feFuncR type="linear" slope="0.25" intercept="0.75"/>
                        <feFuncG type="linear" slope="0.25" intercept="0.75"/>
                        <feFuncB type="linear" slope="0.25" intercept="0.75"/>
                    </feComponentTransfer>
                    <feComposite in="lightNoise" in2="SourceGraphic" operator="in" result="maskedNoise"/>
                    <feBlend mode="multiply" in="maskedNoise" in2="SourceGraphic"/>
                </filter>

                <!-- Improved Corrugation Patterns for Flap Edges (Organic, Textured) -->
                <!-- Profile (Wavy) for Top/Bottom edges -->
                <pattern id="corrugated-h" width="12" height="6" patternUnits="userSpaceOnUse">
                    <path d="M 0 3 Q 3 0 6 3 T 12 3" fill="none" stroke="#6b4623" stroke-width="1.5" stroke-linecap="round"/>
                    <!-- Apply a textured fill *within* the corrugated lines themselves -->
                    <path d="M 0 3 Q 3 0 6 3 T 12 3" fill="none" stroke="#875b34" stroke-width="1" filter="url(#paper-texture)" opacity="0.3"/>
                </pattern>
                <!-- Ribs (Vertical) for Side edges -->
                <pattern id="corrugated-v" width="6" height="12" patternUnits="userSpaceOnUse">
                    <path d="M 3 0 Q 0 3 3 6 T 3 12" fill="none" stroke="#6b4623" stroke-width="1.5" stroke-linecap="round"/>
                     <!-- Apply a textured fill *within* the corrugated lines themselves -->
                    <path d="M 3 0 Q 0 3 3 6 T 3 12" fill="none" stroke="#875b34" stroke-width="1" filter="url(#paper-texture)" opacity="0.3"/>
                </pattern>

                <!-- Box Lighting Gradients -->
                <radialGradient id="boxFloor" cx="50%" cy="50%" r="75%">
                    <stop offset="0%" stop-color="#916238" />
                    <stop offset="65%" stop-color="#694121" />
                    <stop offset="100%" stop-color="#311c0c" />
                </radialGradient>
                <linearGradient id="wallTop" x1="0%" y1="100%" x2="0%" y2="0%">
                    <stop offset="0%" stop-color="#2a1608"/>
                    <stop offset="100%" stop-color="#7c512d"/>
                </linearGradient>
                <linearGradient id="wallBottom" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#2a1608"/>
                    <stop offset="100%" stop-color="#6b4221"/>
                </linearGradient>
                <linearGradient id="wallLeft" x1="100%" y1="0%" x2="0%" y2="0%">
                    <stop offset="0%" stop-color="#2a1608"/>
                    <stop offset="100%" stop-color="#593519"/>
                </linearGradient>
                <linearGradient id="wallRight" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#2a1608"/>
                    <stop offset="100%" stop-color="#603b1c"/>
                </linearGradient>

                <!-- Outer Flap Gradients -->
                <linearGradient id="flapTopGrad" x1="0%" y1="100%" x2="0%" y2="0%">
                    <stop offset="0%" stop-color="#a87a51"/>
                    <stop offset="100%" stop-color="#d39f71"/>
                </linearGradient>
                <linearGradient id="flapBottomGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#b58255"/>
                    <stop offset="100%" stop-color="#dbab82"/>
                </linearGradient>
                <linearGradient id="flapLeftGrad" x1="100%" y1="0%" x2="0%" y2="0%">
                    <stop offset="0%" stop-color="#a3734a"/>
                    <stop offset="100%" stop-color="#cd996c"/>
                </linearGradient>
                <linearGradient id="flapRightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#aa794f"/>
                    <stop offset="100%" stop-color="#d19c6e"/>
                </linearGradient>

                <!-- Object Gradients -->
                <linearGradient id="canisterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#152b21" />
                    <stop offset="30%" stop-color="#3c7a60" />
                    <stop offset="70%" stop-color="#2a5a45" />
                    <stop offset="100%" stop-color="#0f1f18" />
                </linearGradient>
                <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#7f8c8d" />
                    <stop offset="50%" stop-color="#bdc3c7" />
                    <stop offset="100%" stop-color="#34495e" />
                </linearGradient>
                <radialGradient id="leadGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="70%" stop-color="#4a4a50" />
                    <stop offset="90%" stop-color="#7a7a80" />
                    <stop offset="100%" stop-color="#2a2a30" />
                </radialGradient>
            </defs>

            <!-- ================= BOX STRUCTURE ================= -->
            <g id="cardboard-box" filter="url(#paper-texture)">

                <!-- OUTER FLAPS -->
                <g id="outer-flaps">
                    <polygon points="100,100 700,100 760,20 40,20" fill="url(#flapTopGrad)" stroke="#875b34" stroke-width="1"/>
                    <polygon points="100,700 700,700 760,780 40,780" fill="url(#flapBottomGrad)" stroke="#875b34" stroke-width="1"/>
                    <polygon points="100,100 100,700 20,760 20,40" fill="url(#flapLeftGrad)" stroke="#875b34" stroke-width="1"/>
                    <polygon points="700,100 700,700 780,760 780,40" fill="url(#flapRightGrad)" stroke="#875b34" stroke-width="1"/>

                    <!-- FLAP EDGES (Improved Corrugated Thickness and Patterns) -->
                    <!-- Increase thickness slightly for emphasis and apply new patterns -->
                    <rect x="40" y="12" width="720" height="8" fill="#ba8659" stroke="#6b4623" stroke-width="0.5"/>
                    <rect x="40" y="780" width="720" height="8" fill="#ba8659" stroke="#6b4623" stroke-width="0.5"/>
                    <rect x="12" y="40" width="8" height="720" fill="#ba8659" stroke="#6b4623" stroke-width="0.5"/>
                    <rect x="780" y="40" width="8" height="720" fill="#ba8659" stroke="#6b4623" stroke-width="0.5"/>
                    <rect x="40" y="12" width="720" height="8" fill="url(#corrugated-h)" />
                    <rect x="40" y="780" width="720" height="8" fill="url(#corrugated-h)" />
                    <rect x="12" y="40" width="8" height="720" fill="url(#corrugated-v)" />
                    <rect x="780" y="40" width="8" height="720" fill="url(#corrugated-v)" />
                </g>

                <!-- Folds/Creases connecting outer flaps to inner walls -->
                <line x1="100" y1="100" x2="700" y2="100" stroke="#5c3818" stroke-width="3"/>
                <line x1="100" y1="700" x2="700" y2="700" stroke="#5c3818" stroke-width="3"/>
                <line x1="100" y1="100" x2="100" y2="700" stroke="#5c3818" stroke-width="3"/>
                <line x1="700" y1="100" x2="700" y2="700" stroke="#5c3818" stroke-width="3"/>

                <!-- INNER WALLS -->
                <polygon points="100,100 700,100 600,220 200,220" fill="url(#wallTop)" stroke="#2a1608" stroke-width="1.5"/>
                <polygon points="100,700 700,700 600,580 200,580" fill="url(#wallBottom)" stroke="#2a1608" stroke-width="1.5"/>
                <polygon points="100,100 100,700 200,580 200,220" fill="url(#wallLeft)" stroke="#2a1608" stroke-width="1.5"/>
                <polygon points="700,100 700,700 600,580 600,220" fill="url(#wallRight)" stroke="#2a1608" stroke-width="1.5"/>

                <!-- FLOOR -->
                <polygon points="200,220 600,220 600,580 200,580" fill="url(#boxFloor)" stroke="#170c05" stroke-width="3"/>

                <!-- Corner shadows / Creases in floor -->
                <path d="M 200 220 L 250 270 M 600 220 L 550 270 M 200 580 L 250 530 M 600 580 L 550 530" stroke="#221105" stroke-width="4" opacity="0.5"/>
            </g>

            <!-- ================= FLOOR CONTENTS ================= -->
            <g filter="url(#drop-shadow)">

                <!-- 1. RADIOACTIVE MATERIAL & CONTAINER -->
                <g id="radioactive-material" transform="translate(290, 290)">
                    <!-- Main Container Body -->
                    <circle cx="0" cy="0" r="45" fill="url(#leadGrad)" stroke="#1a1a1a" stroke-width="2"/>

                    <!-- Radiation Warning Trefoil engraved on the rim -->
                    <g transform="translate(0, -32) scale(0.6)">
                        <circle cx="0" cy="0" r="14" fill="#f1c40f" stroke="#111" stroke-width="1"/>
                        <path d="M 0 0 L -6 -11 A 12 12 0 0 1 6 -11 Z" fill="#000" />
                        <path d="M 0 0 L -12 3 A 12 12 0 0 0 -2 12 Z" fill="#000" />
                        <path d="M 0 0 L 2 12 A 12 12 0 0 0 12 3 Z" fill="#000" />
                        <circle cx="0" cy="0" r="3" fill="#000" />
                        <circle cx="0" cy="0" r="1.5" fill="#f1c40f" />
                    </g>

                    <!-- Inner hole containing the material -->
                    <circle cx="0" cy="0" r="28" fill="#080808"/>
                </g>

                <!-- 2. GEIGER COUNTER BASE -->
                <g id="geiger-counter" transform="translate(250, 480)">
                    <rect x="0" y="0" width="120" height="70" rx="6" fill="#f39c12" stroke="#945e05" stroke-width="3"/>
                    <rect x="-3" y="10" width="3" height="50" rx="1" fill="#222"/>
                    <rect x="120" y="10" width="3" height="50" rx="1" fill="#222"/>

                    <rect x="10" y="10" width="55" height="35" rx="3" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2"/>
                    <path d="M 15 35 A 25 20 0 0 1 60 35" fill="none" stroke="#bdc3c7" stroke-width="2" />
                    <line x1="15" y1="35" x2="19" y2="33" stroke="#2c3e50" stroke-width="1.5"/>
                    <line x1="37.5" y1="15" x2="37.5" y2="19" stroke="#2c3e50" stroke-width="1.5"/>
                    <line x1="60" y1="35" x2="56" y2="33" stroke="#2c3e50" stroke-width="1.5"/>

                    <g transform="translate(37.5, 38)">
                        <g>
                            <animateTransform attributeName="transform" type="rotate"
                                values="-25 0 0; 30 0 0; 5 0 0; 25 0 0; -10 0 0; -25 0 0"
                                dur="1.1s" repeatCount="indefinite"/>
                            <line x1="0" y1="0" x2="0" y2="-23" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
                            <circle cx="0" cy="0" r="3" fill="#2c3e50"/>
                        </g>
                    </g>
                    <rect x="27.5" y="38" width="20" height="7" fill="#bdc3c7" stroke="#95a5a6" stroke-width="1"/>

                    <g transform="translate(85, 25)">
                        <circle cx="-10" cy="-10" r="2" fill="#2c3e50"/>
                        <circle cx="0" cy="-10" r="2" fill="#2c3e50"/>
                        <circle cx="10" cy="-10" r="2" fill="#2c3e50"/>
                        <circle cx="-15" cy="0" r="2" fill="#2c3e50"/>
                        <circle cx="-5" cy="0" r="2" fill="#2c3e50"/>
                        <circle cx="5" cy="0" r="2" fill="#2c3e50"/>
                        <circle cx="15" cy="0" r="2" fill="#2c3e50"/>
                        <circle cx="-10" cy="10" r="2" fill="#2c3e50"/>
                        <circle cx="0" cy="10" r="2" fill="#2c3e50"/>
                        <circle cx="10" cy="10" r="2" fill="#2c3e50"/>
                    </g>

                    <circle cx="20" cy="58" r="6" fill="#34495e" stroke="#1a252f" stroke-width="1.5"/>
                    <line x1="20" y1="58" x2="20" y2="54" stroke="#ecf0f1" stroke-width="2"/>
                    <circle cx="45" cy="58" r="4" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
                    <rect x="75" y="53" width="20" height="10" rx="2" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1"/>
                    <rect x="78" y="55" width="6" height="6" fill="#34495e"/>

                    <rect x="80" y="-5" width="10" height="5" fill="#7f8c8d" stroke="#2c3e50" stroke-width="1.5"/>
                </g>

                <!-- PANCAKE-STYLE GEIGER DETECTOR & CABLE -->
                <!-- Adjusted path to match new detector location -->
                <path d="M 250 495 C 180 495 200 420 250 380" fill="none" stroke="#1a252f" stroke-width="5" stroke-linecap="round"/>

                <!-- Detector Head moved away from the container (was 240,310 -> now 250,380) -->
                <g transform="translate(250, 380) rotate(20)">
                    <!-- Small metal cable connector -->
                    <rect x="-15" y="-6" width="15" height="12" rx="2" fill="url(#metalGrad)" stroke="#1a252f" stroke-width="2"/>

                    <!-- Detector Body -->
                    <circle cx="12" cy="0" r="22" fill="url(#metalGrad)" stroke="#2c3e50" stroke-width="2"/>

                    <!-- Mesh Sensor Window -->
                    <circle cx="12" cy="0" r="16" fill="#ecf0f1" stroke="#7f8c8d" stroke-width="2"/>
                    <g stroke="#95a5a6" stroke-width="1.5">
                        <line x1="-2" y1="-10" x2="26" y2="-10"/>
                        <line x1="-4" y1="-5" x2="28" y2="-5"/>
                        <line x1="-4" y1="0" x2="28" y2="0"/>
                        <line x1="-4" y1="5" x2="28" y2="5"/>
                        <line x1="-2" y1="10" x2="26" y2="10"/>
                        <line x1="2" y1="-12" x2="2" y2="12"/>
                        <line x1="7" y1="-15" x2="7" y2="15"/>
                        <line x1="12" y1="-16" x2="12" y2="16"/>
                        <line x1="17" y1="-15" x2="17" y2="15"/>
                        <line x1="22" y1="-12" x2="22" y2="12"/>
                    </g>
                </g>

                <!-- 3. POISON GAS CANISTER -->
                <g id="poison-gas" transform="translate(420, 310) rotate(-15)">
                    <rect x="30" y="-30" width="140" height="60" rx="15" fill="url(#canisterGrad)" stroke="#0a140e" stroke-width="3"/>
                    <rect x="15" y="-12" width="15" height="24" fill="url(#metalGrad)" stroke="#2c3e50" stroke-width="2"/>

                    <rect x="-5" y="-15" width="20" height="30" rx="3" fill="#c0392b" stroke="#922b21" stroke-width="2"/>
                    <circle cx="5" cy="0" r="5" fill="#111"/>
                    <rect x="-12" y="-4" width="7" height="8" fill="#2c3e50"/>
                    <circle cx="-5" cy="8" r="2.5" fill="#f1c40f"/>

                    <rect x="60" y="-20" width="80" height="40" rx="2" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
                    <text x="100" y="-4" font-family="sans-serif" font-size="10" font-weight="900" text-anchor="middle" fill="#c0392b" letter-spacing="2">POISON</text>

                    <g transform="translate(100, 8) scale(0.8)">
                        <path d="M -12 -10 L 12 10 M -12 10 L 12 -10" stroke="#2c3e50" stroke-width="4" stroke-linecap="round"/>
                        <circle cx="0" cy="0" r="9" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2"/>
                        <rect x="-5" y="6" width="10" height="6" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2"/>
                        <circle cx="-3.5" cy="-1" r="2" fill="#2c3e50"/>
                        <circle cx="3.5" cy="-1" r="2" fill="#2c3e50"/>
                        <path d="M 0 3 L 0 6" stroke="#2c3e50" stroke-width="1.5"/>
                        <line x1="-2.5" y1="10" x2="-2.5" y2="12" stroke="#2c3e50" stroke-width="1.5"/>
                        <line x1="0" y1="10" x2="0" y2="12" stroke="#2c3e50" stroke-width="1.5"/>
                        <line x1="2.5" y1="10" x2="2.5" y2="12" stroke="#2c3e50" stroke-width="1.5"/>
                    </g>
                </g>

                <!-- 4. CAT'S COLLAR ("Page") - Now Scaled Up -->
                <g id="cat-collar" transform="translate(480, 480) scale(1.5)">
                    <path d="M -20 -10 C -40 -40, 40 -60, 50 -10 C 60 40, -10 50, -20 -10 Z" fill="none" stroke="#e74c3c" stroke-width="12" stroke-linejoin="round"/>
                    <path d="M -20 -10 C -40 -40, 40 -60, 50 -10 C 60 40, -10 50, -20 -10 Z" fill="none" stroke="#ff7675" stroke-width="2" opacity="0.5"/>

                    <g transform="translate(-18, -35) rotate(-30)">
                        <rect x="-8" y="-12" width="16" height="24" rx="2" fill="none" stroke="#f1c40f" stroke-width="3"/>
                        <rect x="-4" y="-12" width="8" height="24" fill="#e74c3c"/>
                        <line x1="-12" y1="0" x2="0" y2="0" stroke="#f1c40f" stroke-width="3" stroke-linecap="round"/>
                    </g>

                    <circle cx="35" cy="20" r="7" fill="none" stroke="#bdc3c7" stroke-width="3"/>

                    <g transform="translate(48, 38)">
                        <circle cx="0" cy="0" r="22" fill="#f1c40f" stroke="#e67e22" stroke-width="2"/>
                        <circle cx="0" cy="0" r="18" fill="none" stroke="#f39c12" stroke-width="1" opacity="0.6"/>
                        <text x="0" y="5" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="900" fill="#2d3436" text-anchor="middle" letter-spacing="1">Page</text>
                    </g>
                </g>
            </g> <!-- End Drop Shadow Group -->

            <!-- TRIGGER WIRE (Connecting Geiger to Solenoid Valve) -->
            <path d="M 335 475 C 340 400, 370 380, 420 318" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
            <path d="M 335 475 C 340 400, 370 380, 420 318" fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-linecap="round"/>


            <!-- ================= GLOWING & ANIMATED EFFECTS ================= -->

            <!-- Radioactive Core -->
            <g transform="translate(290, 290)">
                <circle cx="0" cy="0" r="22" fill="#39ff14" filter="url(#glow)">
                    <animate attributeName="opacity" values="0.6; 1; 0.6" dur="2s" repeatCount="indefinite"/>
                </circle>
                <circle cx="-5" cy="5" r="8" fill="#88ff88" filter="url(#glow)">
                    <animate attributeName="opacity" values="0.8; 1; 0.8" dur="1.5s" repeatCount="indefinite"/>
                </circle>
                <circle cx="8" cy="-6" r="5" fill="#ffffff" opacity="0.8" filter="url(#glow)"/>
            </g>

            <!-- Poison Gas Clouds Escaping -->
            <g opacity="0.8">
                <g fill="#9b59b6" filter="url(#glow)">
                    <circle cx="400" cy="310" r="15" opacity="0.9">
                        <animateTransform attributeName="transform" type="translate" values="0,0; -15,10; -30,20" dur="4s" repeatCount="indefinite"/>
                        <animate attributeName="r" values="10; 25; 40" dur="4s" repeatCount="indefinite"/>
                        <animate attributeName="opacity" values="0.9; 0.5; 0" dur="4s" repeatCount="indefinite"/>
                    </circle>

                    <circle cx="400" cy="310" r="10" opacity="0.8">
                        <animateTransform attributeName="transform" type="translate" values="0,0; 10,20; 15,40" dur="5s" repeatCount="indefinite" begin="1s"/>
                        <animate attributeName="r" values="10; 30; 55" dur="5s" repeatCount="indefinite" begin="1s"/>
                        <animate attributeName="opacity" values="0.8; 0.4; 0" dur="5s" repeatCount="indefinite" begin="1s"/>
                    </circle>

                    <circle cx="400" cy="310" r="12" fill="#8e44ad" opacity="0.7">
                        <animateTransform attributeName="transform" type="translate" values="0,0; -5,-15; -10,-35" dur="4.5s" repeatCount="indefinite" begin="2.5s"/>
                        <animate attributeName="r" values="12; 35; 60" dur="4.5s" repeatCount="indefinite" begin="2.5s"/>
                        <animate attributeName="opacity" values="0.7; 0.3; 0" dur="4.5s" repeatCount="indefinite" begin="2.5s"/>
                    </circle>
                </g>

                <circle cx="360" cy="330" r="45" fill="#8e44ad" filter="url(#glow)" opacity="0.25">
                     <animate attributeName="opacity" values="0.15; 0.35; 0.15" dur="6s" repeatCount="indefinite"/>
                </circle>
                <circle cx="410" cy="380" r="60" fill="#9b59b6" filter="url(#glow)" opacity="0.15">
                     <animate attributeName="opacity" values="0.1; 0.25; 0.1" dur="5s" repeatCount="indefinite"/>
                </circle>
            </g>

        </svg>
    </div>

</body>
</html>
