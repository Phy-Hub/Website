<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schrödinger's cat, Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f172a 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .canvas-container {
            position: relative;
            width: 90vmin;
            height: 90vmin;
            max-width: 700px;
            max-height: 700px;
            filter: drop-shadow(0 25px 35px rgba(0, 0, 0, 0.6));
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- Animations --- */

        /* Gentle breathing effect for the cat's body */
        #cat-breathing-group {
            animation: breathe 4s infinite ease-in-out;
            transform-origin: 250px 250px;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.015) translateY(-2px); }
        }

        /* Occasional tail twitch */
        #tail-group {
            animation: tailTwitch 8s infinite ease-in-out;
            transform-origin: 330px 200px;
        }

        @keyframes tailTwitch {
            0%, 88%, 100% { transform: rotate(0deg); }
            90% { transform: rotate(4deg); }
            94% { transform: rotate(-1deg); }
            97% { transform: rotate(3deg); }
        }

        /* Subtle glow for background stars */
        .star {
            animation: twinkle 3s infinite ease-in-out alternate;
        }

        .star:nth-child(even) { animation-delay: 1.5s; }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 0.8; transform: scale(1.2); }
        }

        /* Floating Zzz's */
        .zzz {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            fill: #ffffff;
            font-weight: bold;
            opacity: 0;
            transform-origin: 140px 190px;
        }

        .z1 { animation: floatZ 4.5s infinite linear 0s; }
        .z2 { animation: floatZ 4.5s infinite linear 1.5s; }
        .z3 { animation: floatZ 4.5s infinite linear 3s; }

        @keyframes floatZ {
            0% {
                opacity: 0;
                transform: translate(0, 0) scale(0.3) rotate(-15deg);
            }
            20% {
                opacity: 0.9;
                transform: translate(-15px, -30px) scale(0.7) rotate(-5deg);
            }
            80% {
                opacity: 0.9;
                transform: translate(-50px, -100px) scale(1.4) rotate(10deg);
            }
            100% {
                opacity: 0;
                transform: translate(-65px, -130px) scale(1.6) rotate(15deg);
            }
        }

        /* Dream Bubble pulsing float */
        #dream-bubble {
            animation: dreamFloat 6s infinite ease-in-out;
            transform-origin: 192px 102px;
        }

        @keyframes dreamFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.02); }
        }
    </style>
</head>
<body>

    <div class="canvas-container">
        <svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
            <!-- DEFINITIONS -->
            <defs>
                <radialGradient id="catGrad" cx="35%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#FFB74D"/>
                    <stop offset="50%" stop-color="#F57C00"/>
                    <stop offset="100%" stop-color="#E65100"/>
                </radialGradient>

                <radialGradient id="pinkGrad" cx="30%" cy="30%" r="60%">
                    <stop offset="0%" stop-color="#FF8A80"/>
                    <stop offset="100%" stop-color="#E53935"/>
                </radialGradient>

                <radialGradient id="rugGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#37474F"/>
                    <stop offset="100%" stop-color="#1A237E"/>
                </radialGradient>

                <clipPath id="body-clip">
                    <ellipse cx="260" cy="230" rx="100" ry="75"/>
                </clipPath>

                <mask id="tail-mask">
                    <path d="M 330 200 C 430 240, 360 360, 240 330 C 160 310, 110 260, 110 210" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>
                </mask>
            </defs>

            <!-- BACKGROUND SCENE -->
            <g fill="#ffffff">
                <circle cx="80" cy="80" r="1.5" class="star"/>
                <circle cx="420" cy="120" r="2" class="star"/>
                <circle cx="120" cy="400" r="1" class="star"/>
                <circle cx="450" cy="380" r="2.5" class="star"/>
                <circle cx="250" cy="50" r="1.5" class="star"/>
            </g>

            <!-- Braided Cozy Rug -->
            <g id="rug">
                <ellipse cx="250" cy="270" rx="220" ry="130" fill="url(#rugGrad)"/>
                <ellipse cx="250" cy="270" rx="200" ry="118" fill="none" stroke="#283593" stroke-width="6" stroke-dasharray="12 8"/>
                <ellipse cx="250" cy="270" rx="180" ry="106" fill="none" stroke="#3949AB" stroke-width="6" stroke-dasharray="12 8"/>
                <ellipse cx="250" cy="270" rx="160" ry="94" fill="none" stroke="#283593" stroke-width="6" stroke-dasharray="12 8"/>
                <ellipse cx="250" cy="270" rx="140" ry="82" fill="none" stroke="#3949AB" stroke-width="6" stroke-dasharray="12 8"/>
            </g>

            <ellipse cx="250" cy="290" rx="130" ry="70" fill="#000000" opacity="0.35"/>
            <path d="M 380 345 C 380 390, 310 390, 280 360 C 230 310, 190 340, 160 300" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>

            <!-- ENTIRE CAT GROUP -->
            <g id="cat-breathing-group">

                <!-- TAIL LAYER -->
                <g id="tail-group">
                    <path d="M 330 200 C 430 240, 360 360, 240 330 C 160 310, 110 260, 110 210" fill="none" stroke="#000000" stroke-width="36" stroke-linecap="round" opacity="0.25" transform="translate(0, 8)"/>
                    <path d="M 330 200 C 430 240, 360 360, 240 330 C 160 310, 110 260, 110 210" fill="none" stroke="url(#catGrad)" stroke-width="36" stroke-linecap="round"/>
                    <g mask="url(#tail-mask)" opacity="0.8">
                        <path d="M 355 193 L 337 229 M 374 212 L 352 244 M 393 238 L 361 260 M 397 279 L 357 273 M 381 314 L 353 286 M 352 337 L 338 299 M 310 349 L 310 309 M 275 352 L 285 312 M 240 350 L 250 310 M 215 343 L 225 303 M 190 330 L 205 294 M 165 315 L 182 279 M 145 297 L 165 263 M 127 279 L 148 249 M 113 259 L 138 233 M 103 238 L 133 218" fill="none" stroke="#BF360C" stroke-width="12" stroke-linecap="round"/>
                        <circle cx="110" cy="210" r="24" fill="#BF360C" stroke="none" />
                    </g>
                </g>

                <!-- BODY LAYER -->
                <g id="body">
                    <ellipse cx="260" cy="230" rx="100" ry="75" fill="url(#catGrad)"/>
                    <g clip-path="url(#body-clip)">
                        <path d="M 180 170 Q 220 210 190 270" fill="none" stroke="#BF360C" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
                        <path d="M 210 160 Q 250 210 220 280" fill="none" stroke="#BF360C" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
                        <path d="M 240 155 Q 280 210 250 290" fill="none" stroke="#BF360C" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
                        <path d="M 270 155 Q 310 210 280 290" fill="none" stroke="#BF360C" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
                        <path d="M 300 160 Q 340 210 310 280" fill="none" stroke="#BF360C" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
                        <path d="M 330 170 Q 370 210 340 270" fill="none" stroke="#BF360C" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
                    </g>
                    <ellipse cx="315" cy="245" rx="45" ry="60" fill="url(#catGrad)" transform="rotate(35 315 245)"/>
                    <path d="M 300 210 Q 340 250 305 295" fill="none" stroke="#BF360C" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
                    <g id="back-paw">
                        <ellipse cx="280" cy="298" rx="20" ry="14" fill="url(#catGrad)" />
                        <path d="M 270 305 L 270 293 M 280 308 L 280 295" fill="none" stroke="#BF360C" stroke-width="2.5" stroke-linecap="round"/>
                    </g>
                </g>

                <!-- HEAD LAYER -->
                <g id="head-group">
                    <polygon points="125,185 110,115 160,165" fill="url(#catGrad)"/>
                    <polygon points="127,175 118,125 152,162" fill="url(#pinkGrad)"/>
                    <polygon points="170,165 215,110 220,175" fill="url(#catGrad)"/>
                    <polygon points="175,165 208,122 212,170" fill="url(#pinkGrad)"/>
                    <ellipse cx="170" cy="205" rx="60" ry="50" fill="url(#catGrad)"/>
                    <path d="M 150 170 L 160 185 L 170 172 L 180 185 L 190 170" fill="none" stroke="#BF360C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
                    <polygon points="115,200 100,195 110,210 95,215 115,225" fill="url(#catGrad)"/>
                    <polygon points="225,200 240,195 230,210 245,215 225,225" fill="url(#catGrad)"/>
                    <circle cx="140" cy="215" r="10" fill="#FF5252" opacity="0.3"/>
                    <circle cx="200" cy="215" r="10" fill="#FF5252" opacity="0.3"/>
                    <path d="M 135 212 Q 145 222 155 212" fill="none" stroke="#3E2723" stroke-width="4" stroke-linecap="round"/>
                    <path d="M 185 212 Q 195 222 205 212" fill="none" stroke="#3E2723" stroke-width="4" stroke-linecap="round"/>
                    <polygon points="163,228 177,228 170,235" fill="url(#pinkGrad)"/>
                    <path d="M 160 240 Q 170 248 170 235 Q 170 248 180 240" fill="none" stroke="#3E2723" stroke-width="3" stroke-linecap="round"/>
                    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
                        <line x1="135" y1="225" x2="90" y2="220"/>
                        <line x1="135" y1="230" x2="85" y2="235"/>
                        <line x1="135" y1="235" x2="95" y2="250"/>
                        <line x1="205" y1="225" x2="250" y2="220"/>
                        <line x1="205" y1="230" x2="255" y2="235"/>
                        <line x1="205" y1="235" x2="245" y2="250"/>
                    </g>
                </g>

                <!-- PAWS LAYER -->
                <g id="paws">
                    <ellipse cx="145" cy="255" rx="20" ry="13" fill="url(#catGrad)"/>
                    <path d="M 135 262 L 135 252 M 145 264 L 145 254" fill="none" stroke="#BF360C" stroke-width="2.5" stroke-linecap="round"/>
                    <ellipse cx="195" cy="255" rx="20" ry="13" fill="url(#catGrad)"/>
                    <path d="M 195 264 L 195 254 M 205 262 L 205 252" fill="none" stroke="#BF360C" stroke-width="2.5" stroke-linecap="round"/>
                </g>

            </g>

            <!-- SCHRÖDINGER DREAM BUBBLE (Cloud body adjusted -30x from the last iteration) -->
            <g id="dream-bubble">
                <!-- Thought Trail (Stays in the exact same original place) -->
                <circle cx="170" cy="145" r="4.5" fill="#ffffff" opacity="0.6"/>
                <circle cx="180" cy="125" r="7.5" fill="#ffffff" opacity="0.7"/>
                <circle cx="199" cy="106" r="12" fill="#ffffff" opacity="0.9"/>

                <!-- Cloud Drop Shadow (-30 to main cloud parts) -->
                <g fill="#000000" opacity="0.25" transform="translate(0, 6)">
                    <ellipse cx="285" cy="85" rx="55" ry="35"/>
                    <circle cx="250" cy="65" r="28"/>
                    <circle cx="285" cy="55" r="35"/>
                    <circle cx="325" cy="65" r="28"/>
                    <circle cx="345" cy="90" r="22"/>
                    <circle cx="325" cy="115" r="25"/>
                    <circle cx="285" cy="120" r="22"/>
                    <circle cx="245" cy="110" r="26"/>
                    <circle cx="230" cy="85" r="24"/>
                </g>

                <!-- Main White Cloud Base (-30 to main cloud parts) -->
                <g fill="#ffffff" opacity="0.95">
                    <ellipse cx="285" cy="85" rx="55" ry="35"/>
                    <circle cx="250" cy="65" r="28"/>
                    <circle cx="285" cy="55" r="35"/>
                    <circle cx="325" cy="65" r="28"/>
                    <circle cx="345" cy="90" r="22"/>
                    <circle cx="325" cy="115" r="25"/>
                    <circle cx="285" cy="120" r="22"/>
                    <circle cx="245" cy="110" r="26"/>
                    <circle cx="230" cy="85" r="24"/>
                </g>

                <!-- Equation Text (Transform x adjusted by -30) -->
                <g transform="translate(285, 85)" font-family="'Times New Roman', Times, serif" font-size="22" fill="#1A237E" font-weight="bold" text-anchor="middle">
                    <text x="-50" y="7" font-style="italic">i&#8463;</text>
                    <text x="-14" y="-5" font-style="italic">&#8706;&#936;</text>
                    <!-- Fraction division line -->
                    <line x1="-35" y1="2" x2="7" y2="2" stroke="#1A237E" stroke-width="2"/>
                    <text x="-14" y="21" font-style="italic">&#8706;t</text>
                    <text x="24" y="7" font-style="normal">=</text>
                    <text x="52" y="7" font-style="italic">&#292;&#936;</text>
                </g>
            </g>

            <!-- FOREGROUND PROPS (Yarn) -->
            <g id="yarn-ball" transform="translate(0, -10)">
                <circle cx="390" cy="350" r="25" fill="#000000" opacity="0.4"/>
                <circle cx="390" cy="340" r="25" fill="#00E5FF"/>
                <path d="M 370 330 Q 390 315 410 345 M 368 340 Q 390 355 412 335 M 380 316 Q 380 340 375 360" fill="none" stroke="#00838F" stroke-width="3"/>
                <path d="M 395 316 Q 405 340 395 364" fill="none" stroke="#00838F" stroke-width="2"/>
            </g>

            <!-- SLEEPING ZZZ's -->
            <text x="140" y="190" class="zzz z1" font-size="24">Z</text>
            <text x="140" y="190" class="zzz z2" font-size="24">Z</text>
            <text x="140" y="190" class="zzz z3" font-size="24">Z</text>

        </svg>
    </div>

</body>
</html>
